<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Circuit Tracker</title>
<style>
  :root{
    --accent:#1f6f4a;
    --accent-light:#2f9c68;
    --bg:#f4f5f3;
    --card:#ffffff;
    --text:#1c1e1c;
    --text-dim:#767c77;
    --border:#e2e4e0;
    --danger:#c0432c;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f100f;
      --card:#1b1d1b;
      --text:#f0f1ef;
      --text-dim:#8b918c;
      --border:#2c2f2c;
      --accent:#3fbf83;
      --accent-light:#59d69a;
    }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
  }
  header{
    padding:18px 18px 10px;
    position:sticky; top:0;
    background:var(--bg);
    z-index:5;
  }
  h1{font-size:22px; margin:0 0 2px; letter-spacing:-0.3px;}
  .sub{color:var(--text-dim); font-size:13px;}
  main{padding:0 16px 24px; max-width:520px; margin:0 auto;}

  .seg{
    display:flex; background:var(--card); border:1px solid var(--border);
    border-radius:12px; padding:3px; margin:14px 0;
  }
  .seg button{
    flex:1; border:none; background:transparent; color:var(--text-dim);
    padding:9px 0; font-size:14px; font-weight:600; border-radius:9px; font-family:inherit;
  }
  .seg button.active{background:var(--accent); color:#fff;}

  .row{display:flex; gap:10px; align-items:center;}
  .rounds-picker{display:flex; gap:8px; margin:6px 0 18px;}
  .rounds-picker button{
    flex:1; padding:10px 0; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-weight:600; font-size:14px; font-family:inherit;
  }
  .rounds-picker button.active{background:var(--accent); border-color:var(--accent); color:#fff;}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 14px; margin-bottom:10px;
  }
  .warmup-item{display:flex; align-items:center; gap:10px; padding:8px 0;}
  .warmup-item:not(:last-child){border-bottom:1px solid var(--border);}
  .checkbox{
    width:22px; height:22px; border-radius:7px; border:2px solid var(--border);
    flex:none; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff;
  }
  .checkbox.checked{background:var(--accent); border-color:var(--accent);}

  .round-label{font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:0.6px; margin:18px 2px 8px;}
  .ex-row{display:flex; align-items:center; gap:10px; padding:10px 0;}
  .ex-row:not(:last-child){border-bottom:1px solid var(--border);}
  .ex-name{flex:1; min-width:0;}
  .ex-name .n{font-size:15px; font-weight:600;}
  .ex-name .t{font-size:12px; color:var(--text-dim); margin-top:1px;}
  .stepper{display:flex; align-items:center; gap:0; background:var(--bg); border-radius:10px; border:1px solid var(--border);}
  .stepper button{
    width:32px; height:32px; border:none; background:transparent; color:var(--accent);
    font-size:18px; font-weight:700; font-family:inherit;
  }
  .stepper .val{width:34px; text-align:center; font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;}
  .hit{color:var(--accent) !important;}

  .save-bar{
    position:fixed; left:0; right:0; bottom:0;
    padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 60%, transparent);
  }
  .save-btn{
    width:100%; max-width:520px; margin:0 auto; display:block;
    background:var(--accent); color:#fff; border:none; border-radius:14px;
    padding:14px 0; font-size:16px; font-weight:700; font-family:inherit;
  }
  .save-btn:active{background:var(--accent-light);}
  .save-btn.saved{background:var(--text-dim);}

  .tabs{
    position:fixed; bottom:0; left:0; right:0;
    display:flex; background:var(--card); border-top:1px solid var(--border);
    padding-bottom:env(safe-area-inset-bottom);
    display:none;
  }
  .top-tabs{display:flex; gap:8px; margin-bottom:4px;}
  .top-tabs button{
    flex:1; padding:9px 0; border-radius:10px; border:none; background:transparent;
    color:var(--text-dim); font-weight:700; font-size:13px; font-family:inherit;
  }
  .top-tabs button.active{background:var(--card); color:var(--accent); box-shadow:0 0 0 1px var(--border);}

  .empty{color:var(--text-dim); font-size:14px; text-align:center; padding:30px 0;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .stat .num{font-size:22px; font-weight:800;}
  .stat .lbl{font-size:12px; color:var(--text-dim); margin-top:2px;}

  .bars{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px;}
  .bar-row{display:flex; align-items:flex-end; gap:5px; height:110px; margin-top:6px;}
  .bar{flex:1; background:var(--accent); border-radius:4px 4px 0 0; min-height:3px; position:relative;}
  .bar.day2{background:#c78a2f;}
  .bar-labels{display:flex; gap:5px; margin-top:6px;}
  .bar-labels span{flex:1; text-align:center; font-size:9px; color:var(--text-dim);}

  .hist-item{padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .hist-item:last-child{border-bottom:none;}
  .hist-date{font-weight:700; font-size:14px;}
  .hist-meta{color:var(--text-dim); font-size:12px; margin-top:1px;}

  .link-btn{background:none; border:none; color:var(--accent); font-weight:700; font-size:14px; font-family:inherit; padding:8px 0;}

  .edit-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
  .edit-row:last-child{border-bottom:none;}
  .edit-row input{
    width:60px; text-align:center; border:1px solid var(--border); background:var(--bg);
    color:var(--text); border-radius:8px; padding:6px 0; font-size:14px; font-family:inherit;
  }
  .edit-name{flex:1; font-size:14px;}

  h2.section{font-size:16px; margin:18px 2px 8px;}
</style>
</head>
<body>

<header>
  <h1>Circuit</h1>
  <div class="sub" id="dateLine"></div>
  <div class="top-tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="history">History</button>
    <button data-tab="edit">Edit</button>
  </div>
</header>

<main>

  <!-- TODAY -->
  <section id="tab-today">
    <div class="seg">
      <button data-day="day1" class="active">Day 1</button>
      <button data-day="day2">Day 2</button>
    </div>

    <div class="card">
      <div class="round-label" style="margin-top:0">Warm-up</div>
      <div id="warmupList"></div>
    </div>

    <div class="card" id="weightsCard" style="display:none">
      <div class="round-label" style="margin-top:0">Weights</div>
      <div id="weightsList"></div>
    </div>

    <div class="rounds-picker" id="roundsPicker"></div>

    <div id="roundsContainer"></div>

    <div style="height:70px"></div>
  </section>

  <!-- HISTORY -->
  <section id="tab-history" style="display:none">
    <div class="stat-grid">
      <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">day streak</div></div>
      <div class="stat"><div class="num" id="statTotal">0</div><div class="lbl">sessions logged</div></div>
    </div>
    <div class="bars">
      <div style="font-size:13px; font-weight:700;">Last 10 sessions — reps completed</div>
      <div class="bar-row" id="barRow"></div>
      <div class="bar-labels" id="barLabels"></div>
    </div>
    <h2 class="section">Sessions</h2>
    <div class="card" id="histList"><div class="empty">No sessions yet</div></div>
    <button class="link-btn" id="exportBtn">Export CSV</button>
  </section>

  <!-- EDIT -->
  <section id="tab-edit" style="display:none">
    <h2 class="section">Day 1 targets</h2>
    <div class="card" id="editDay1"></div>
    <h2 class="section">Day 2 targets</h2>
    <div class="card" id="editDay2"></div>
    <button class="link-btn" id="resetBtn">Reset all data</button>
  </section>

</main>

<div class="save-bar" id="saveBar">
  <button class="save-btn" id="saveBtn">Save Session</button>
</div>

<script>
const STORAGE_KEY = 'circuit_log_v1';

const DEFAULTS = {
  day1: {
    label: 'Circuit Day 1',
    exercises: [
      {id:'calf_d', name:'Calf Raises (double leg)', unit:'reps', target:20},
      {id:'inv_row', name:'Inverted Rows', unit:'reps', target:10},
      {id:'goblet', name:'Goblet Squats', unit:'reps', target:10, weighted:true, weightLabel:'KB/DB weight', defaultWeight:35},
      {id:'pushup', name:'Push Ups', unit:'reps', target:10},
      {id:'kb_swing', name:'Kettlebell Swings', unit:'reps', target:10, weighted:true, weightLabel:'Kettlebell weight', defaultWeight:35},
    ]
  },
  day2: {
    label: 'Circuit Day 2',
    exercises: [
      {id:'calf_s', name:'Calf Raises (single leg)', unit:'reps/leg', target:10},
      {id:'hang', name:'Dead Hangs', unit:'sec', target:30},
      {id:'lunge', name:'DB Lunges', unit:'reps/leg', target:10, weighted:true, weightLabel:'DB weight (each)', defaultWeight:15},
      {id:'ohp', name:'DB Overhead Press', unit:'reps', target:10, weighted:true, weightLabel:'DB weight (each)', defaultWeight:15},
      {id:'rdl_row', name:'RDL with Row', unit:'reps', target:10, weighted:true, weightLabel:'DB weight (each)', defaultWeight:15},
    ]
  }
};

const WARMUP = ['Lateral steps with band', 'Lateral jumps with band', 'Side steps with band'];

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { config: DEFAULTS, sessions: [] };
    const parsed = JSON.parse(raw);
    if(!parsed.config) parsed.config = DEFAULTS;
    if(!parsed.sessions) parsed.sessions = [];
    return parsed;
  }catch(e){ return { config: DEFAULTS, sessions: [] }; }
}
function save(state){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = load();
let currentDay = 'day1';
let currentRounds = 2;
let liveData = {}; // {exId: [round1val, round2val, round3val]}
let liveWeights = {}; // {exId: weight}
let warmupChecked = {};

function getLastWeight(exId, fallback){
  const past = state.sessions.slice().reverse().find(s => s.entries[exId] && s.entries[exId].weight != null);
  return past ? past.entries[exId].weight : fallback;
}

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function fmtDate(d){
  return d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
}
$('#dateLine').textContent = fmtDate(new Date());

// ---- Tabs ----
$$('.top-tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    $$('.top-tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['today','history','edit'].forEach(t=>{
      $('#tab-'+t).style.display = (t===btn.dataset.tab) ? 'block' : 'none';
    });
    $('#saveBar').style.display = (btn.dataset.tab==='today') ? 'block' : 'none';
    if(btn.dataset.tab==='history') renderHistory();
    if(btn.dataset.tab==='edit') renderEdit();
  });
});

// ---- Day toggle ----
$$('.seg button[data-day]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    $$('.seg button[data-day]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentDay = btn.dataset.day;
    resetLiveData();
    renderToday();
  });
});

// ---- Rounds picker ----
function renderRoundsPicker(){
  const wrap = $('#roundsPicker');
  wrap.innerHTML = '';
  [2,3].forEach(n=>{
    const b = document.createElement('button');
    b.textContent = n + ' rounds';
    if(n===currentRounds) b.classList.add('active');
    b.addEventListener('click', ()=>{
      currentRounds = n;
      resetLiveData();
      renderRoundsPicker();
      renderRounds();
    });
    wrap.appendChild(b);
  });
}

function resetLiveData(){
  liveData = {};
  const cfg = state.config[currentDay];
  liveWeights = {};
  cfg.exercises.forEach(ex=>{
    liveData[ex.id] = Array.from({length:3}, ()=> ex.target);
    if(ex.weighted) liveWeights[ex.id] = getLastWeight(ex.id, ex.defaultWeight);
  });
  warmupChecked = {};
  WARMUP.forEach((w,i)=> warmupChecked[i]=false);
  $('#saveBtn').textContent = 'Save Session';
  $('#saveBtn').classList.remove('saved');
}

// ---- Warmup ----
function renderWarmup(){
  const wrap = $('#warmupList');
  wrap.innerHTML = '';
  WARMUP.forEach((w,i)=>{
    const row = document.createElement('div');
    row.className = 'warmup-item';
    const box = document.createElement('div');
    box.className = 'checkbox' + (warmupChecked[i] ? ' checked' : '');
    box.textContent = warmupChecked[i] ? '✓' : '';
    box.addEventListener('click', ()=>{
      warmupChecked[i] = !warmupChecked[i];
      renderWarmup();
    });
    const label = document.createElement('div');
    label.textContent = w;
    label.style.fontSize = '14px';
    row.appendChild(box);
    row.appendChild(label);
    wrap.appendChild(row);
  });
}

// ---- Weights ----
function renderWeights(){
  const cfg = state.config[currentDay];
  const weighted = cfg.exercises.filter(ex=>ex.weighted);
  const card = $('#weightsCard');
  const list = $('#weightsList');
  if(weighted.length===0){ card.style.display='none'; return; }
  card.style.display='block';
  list.innerHTML='';
  weighted.forEach(ex=>{
    const row = document.createElement('div');
    row.className = 'ex-row';
    const nameWrap = document.createElement('div');
    nameWrap.className = 'ex-name';
    const n = document.createElement('div'); n.className='n'; n.textContent = ex.name;
    const t = document.createElement('div'); t.className='t'; t.textContent = ex.weightLabel || 'weight';
    nameWrap.appendChild(n); nameWrap.appendChild(t);

    const stepper = document.createElement('div');
    stepper.className = 'stepper';
    const minus = document.createElement('button'); minus.textContent='−';
    minus.addEventListener('click', ()=>{
      liveWeights[ex.id] = Math.max(0, liveWeights[ex.id] - 5);
      renderWeights();
    });
    const valEl = document.createElement('div');
    valEl.className = 'val';
    valEl.textContent = liveWeights[ex.id] + ' lb';
    valEl.style.width = '52px';
    const plus = document.createElement('button'); plus.textContent='+';
    plus.addEventListener('click', ()=>{
      liveWeights[ex.id] = liveWeights[ex.id] + 5;
      renderWeights();
    });
    stepper.appendChild(minus); stepper.appendChild(valEl); stepper.appendChild(plus);

    row.appendChild(nameWrap);
    row.appendChild(stepper);
    list.appendChild(row);
  });
}

// ---- Rounds/exercises ----
function stepVal(exId, roundIdx, delta, unit){
  const min = unit==='sec' ? 5 : 0;
  liveData[exId][roundIdx] = Math.max(min, liveData[exId][roundIdx] + delta);
  renderRounds();
}

function renderRounds(){
  const wrap = $('#roundsContainer');
  wrap.innerHTML = '';
  const cfg = state.config[currentDay];

  for(let r=0; r<currentRounds; r++){
    const label = document.createElement('div');
    label.className = 'round-label';
    label.textContent = 'Round ' + (r+1);
    wrap.appendChild(label);

    const card = document.createElement('div');
    card.className = 'card';

    cfg.exercises.forEach(ex=>{
      const row = document.createElement('div');
      row.className = 'ex-row';

      const nameWrap = document.createElement('div');
      nameWrap.className = 'ex-name';
      const n = document.createElement('div'); n.className='n'; n.textContent = ex.name;
      const t = document.createElement('div'); t.className='t'; t.textContent = 'target: ' + ex.target + ' ' + ex.unit;
      nameWrap.appendChild(n); nameWrap.appendChild(t);

      const val = liveData[ex.id][r];
      const stepper = document.createElement('div');
      stepper.className = 'stepper';
      const step = ex.unit==='sec' ? 5 : 1;
      const minus = document.createElement('button'); minus.textContent='−';
      minus.addEventListener('click', ()=> stepVal(ex.id, r, -step, ex.unit));
      const valEl = document.createElement('div');
      valEl.className = 'val' + (val >= ex.target ? ' hit' : '');
      valEl.textContent = val;
      const plus = document.createElement('button'); plus.textContent='+';
      plus.addEventListener('click', ()=> stepVal(ex.id, r, step, ex.unit));
      stepper.appendChild(minus); stepper.appendChild(valEl); stepper.appendChild(plus);

      row.appendChild(nameWrap);
      row.appendChild(stepper);
      card.appendChild(row);
    });

    wrap.appendChild(card);
  }
}

function renderToday(){
  renderWarmup();
  renderWeights();
  renderRoundsPicker();
  renderRounds();
}

// ---- Save ----
$('#saveBtn').addEventListener('click', ()=>{
  const cfg = state.config[currentDay];
  const entries = {};
  let totalReps = 0;
  cfg.exercises.forEach(ex=>{
    const vals = liveData[ex.id].slice(0, currentRounds);
    entries[ex.id] = { name: ex.name, unit: ex.unit, target: ex.target, rounds: vals };
    if(ex.weighted) entries[ex.id].weight = liveWeights[ex.id];
    if(ex.unit !== 'sec') totalReps += vals.reduce((a,b)=>a+b,0);
  });
  const session = {
    date: new Date().toISOString(),
    day: currentDay,
    dayLabel: cfg.label,
    rounds: currentRounds,
    warmupDone: Object.values(warmupChecked).every(Boolean),
    entries,
    totalReps
  };
  state.sessions.push(session);
  save(state);
  $('#saveBtn').textContent = 'Saved ✓';
  $('#saveBtn').classList.add('saved');
});

// ---- History ----
function renderHistory(){
  const sessions = state.sessions.slice().sort((a,b)=> new Date(b.date)-new Date(a.date));
  $('#statTotal').textContent = sessions.length;

  // streak: consecutive days with a session, walking back from today
  let streak = 0;
  let cursor = new Date(); cursor.setHours(0,0,0,0);
  const daySet = new Set(sessions.map(s=>{
    const d = new Date(s.date); d.setHours(0,0,0,0); return d.getTime();
  }));
  while(daySet.has(cursor.getTime())){
    streak++;
    cursor.setDate(cursor.getDate()-1);
  }
  $('#statStreak').textContent = streak;

  // bars: last 10 sessions total reps
  const last10 = sessions.slice(0,10).reverse();
  const max = Math.max(1, ...last10.map(s=>s.totalReps));
  const barRow = $('#barRow'); barRow.innerHTML='';
  const barLabels = $('#barLabels'); barLabels.innerHTML='';
  last10.forEach(s=>{
    const bar = document.createElement('div');
    bar.className = 'bar' + (s.day==='day2' ? ' day2' : '');
    bar.style.height = Math.max(4, (s.totalReps/max)*100) + '%';
    barRow.appendChild(bar);
    const lbl = document.createElement('span');
    const d = new Date(s.date);
    lbl.textContent = (d.getMonth()+1)+'/'+d.getDate();
    barLabels.appendChild(lbl);
  });

  // list
  const list = $('#histList');
  if(sessions.length===0){
    list.innerHTML = '<div class="empty">No sessions yet</div>';
  } else {
    list.innerHTML = '';
    sessions.slice(0,25).forEach(s=>{
      const d = new Date(s.date);
      const weightBits = Object.values(s.entries)
        .filter(e => e.weight != null)
        .map(e => `${e.name.replace('DB ','').replace('Kettlebell ','KB ')} ${e.weight}lb`)
        .join(' · ');
      const item = document.createElement('div');
      item.className = 'hist-item';
      item.innerHTML = `<div class="hist-date">${s.dayLabel} — ${fmtDate(d)}</div>
        <div class="hist-meta">${s.rounds} rounds · ${s.totalReps} reps${s.warmupDone ? ' · warm-up ✓' : ''}</div>
        ${weightBits ? `<div class="hist-meta">${weightBits}</div>` : ''}`;
      list.appendChild(item);
    });
  }
}

$('#exportBtn').addEventListener('click', ()=>{
  const rows = [['date','day','round','exercise','unit','target','value','weight_lb']];
  state.sessions.forEach(s=>{
    Object.values(s.entries).forEach(e=>{
      e.rounds.forEach((v, i)=>{
        rows.push([s.date, s.dayLabel, i+1, e.name, e.unit, e.target, v, e.weight != null ? e.weight : '']);
      });
    });
  });
  const csv = rows.map(r=> r.map(c=> `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'circuit_log.csv';
  a.click();
  URL.revokeObjectURL(url);
});

// ---- Edit ----
function renderEdit(){
  ['day1','day2'].forEach(day=>{
    const wrap = $('#edit' + (day==='day1' ? 'Day1' : 'Day2'));
    wrap.innerHTML = '';
    state.config[day].exercises.forEach(ex=>{
      const row = document.createElement('div');
      row.className = 'edit-row';
      const name = document.createElement('div');
      name.className = 'edit-name';
      name.textContent = ex.name + ' (' + ex.unit + ')';
      const input = document.createElement('input');
      input.type = 'number';
      input.value = ex.target;
      input.addEventListener('change', ()=>{
        ex.target = Number(input.value) || ex.target;
        save(state);
        if(currentDay===day) resetLiveData();
      });
      row.appendChild(name);
      row.appendChild(input);
      wrap.appendChild(row);
    });
  });
}

$('#resetBtn').addEventListener('click', ()=>{
  if(confirm('Delete all logged sessions? This cannot be undone.')){
    state = { config: state.config, sessions: [] };
    save(state);
    renderHistory();
  }
});

// ---- Init ----
resetLiveData();
renderToday();
</script>
</body>
</html>
